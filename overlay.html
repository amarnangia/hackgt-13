<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Subtitles</title>
<style>
  :root { --bg: #111418; --card: #1b2027; --text: #f2f4f7; --muted: #8b95a3; --accent: #f5a524; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, "Noto Sans Telugu", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: var(--muted); font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
  .dot.live { background: #3ecf8e; }
  .dot.speaking { background: var(--accent); animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { to { opacity: 0.3; } }
  #lines { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 16px; }
  .line { background: var(--card); border-radius: 12px; padding: 12px 14px; opacity: 0.55; }
  .line:first-child { opacity: 1; }
  .orig { color: var(--muted); font-size: 18px; }
  .en { font-size: 26px; font-weight: 600; margin-top: 4px; min-height: 1.4em; }
  .en.pending { color: var(--muted); font-weight: 400; font-size: 18px; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .card { background: #262d36; border-radius: 10px; padding: 6px 10px; font-size: 15px; max-width: 100%; }
  .card b { color: var(--accent); }
  .card span { color: var(--muted); }
  .line.ask { border-left: 4px solid var(--accent); }
  .kept { color: var(--accent); cursor: pointer; border-bottom: 1px dashed var(--accent); }
  .kept small { color: var(--muted); font-weight: 400; font-size: 0.6em; margin-left: 3px; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 16px 8px; }
  #ask { margin: 0 16px 12px; background: #2d2210; border: 2px solid var(--accent); border-radius: 14px; padding: 12px 14px;
         display: none; }
  #ask.show { display: block; animation: pop .3s ease; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #ask .label { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
  #ask .te { font-size: 22px; margin-top: 4px; }
  #ask .roman { font-size: 24px; font-weight: 700; color: var(--text); }
  #ask .meaning { color: var(--muted); font-size: 15px; }
  header a { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 13px; }
  #popup { position: fixed; right: 16px; bottom: 16px; width: min(360px, calc(100vw - 32px)); background: var(--card);
           border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); transform: translateY(140%);
           transition: transform .35s ease; }
  #popup.show { transform: translateY(0); }
  #popup img { width: 100%; height: 220px; object-fit: cover; display: block; background: #000; }
  #popup .body { padding: 12px 14px 14px; }
  #popup .name { font-size: 22px; font-weight: 700; color: var(--accent); }
  #popup .desc { color: var(--text); font-size: 15px; margin-top: 4px; }
  .thumb { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; vertical-align: middle; margin-right: 8px; }
  #live { padding: 0 16px 10px; color: var(--accent); font-size: 20px; min-height: 1.6em; }
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><span id="status">connecting…</span><a href="/calls/dictionary.html" target="_blank">📖 Family dictionary</a></header>
<div id="ask"><div class="label"></div><div class="te"></div><div class="roman"></div><div class="meaning"></div></div>
<div class="hint">Orange words stay in Telugu because you know them. Click one if you don't.</div>
<div id="live"></div>
<div id="lines"></div>
<div id="popup"><img alt=""><div class="body"><div class="name"></div><div class="desc"></div></div></div>
<script>
const lines = document.getElementById("lines");
const dot = document.getElementById("dot"), status = document.getElementById("status");
const live = document.getElementById("live");
const byId = {};
const ICONS = { food: "🍛", vehicle: "🛺", place: "🛕", clothing: "🥻", festival: "🪔", family: "👵", idiom: "💬", slang: "💬", phrase: "💬", culture: "🙏", word: "🔤", web: "🖼️" };

let socket = null;
let popupTimer = null;
let askTimer = null;

// A question the grandkid can ask in Telugu when grandma pauses in a story.
function showAsk(m) {
  const ask = document.getElementById("ask");
  ask.querySelector(".label").textContent = "💬 Ask " + (m.caller || "her") + ":";
  ask.querySelector(".te").textContent = m.telugu;
  ask.querySelector(".roman").textContent = "“" + m.roman + "”";
  ask.querySelector(".meaning").textContent = m.english;
  ask.classList.remove("show"); void ask.offsetWidth; ask.classList.add("show");
  clearTimeout(askTimer);
  askTimer = setTimeout(() => ask.classList.remove("show"), 25000);
}

// A picture of the thing grandma just mentioned, e.g. pulihora; also kept as a thumbnail on that line.
function showPicture(m) {
  const pop = document.getElementById("popup");
  pop.querySelector("img").src = "/" + m.image;
  pop.querySelector(".name").textContent = m.name;
  pop.querySelector(".desc").textContent = m.description || "";
  pop.classList.add("show");
  clearTimeout(popupTimer);
  popupTimer = setTimeout(() => pop.classList.remove("show"), 9000);
  const el = byId[m.id];
  if (el) {
    const card = document.createElement("div"); card.className = "card";
    const img = document.createElement("img"); img.className = "thumb"; img.src = "/" + m.image;
    const b = document.createElement("b"); b.textContent = m.name;
    card.append(img, b);
    let box = el.querySelector(".cards");
    if (!box) { box = document.createElement("div"); box.className = "cards"; el.append(box); }
    box.prepend(card);
  }
}

// Words kept in Telugu are highlighted with their English underneath; click one if you've forgotten it.
function renderKept(en, text, kept) {
  en.textContent = "";
  let rest = text;
  for (const k of kept) {
    const i = rest.indexOf(k.telugu);
    if (i < 0) continue;
    en.append(rest.slice(0, i));
    const w = document.createElement("span"); w.className = "kept"; w.title = "Click if you don't know this word";
    w.textContent = k.telugu;
    const small = document.createElement("small"); small.textContent = "(" + k.english + ")"; w.append(small);
    w.onclick = () => { if (socket) socket.send(JSON.stringify({ type: "forget", id: k.id })); w.replaceWith(k.english); };
    en.append(w);
    rest = rest.slice(i + k.telugu.length);
  }
  en.append(rest);
}

function connect() {
  const ws = socket = new WebSocket(`ws://${location.host || "localhost:8765"}`);
  ws.onopen = () => { dot.className = "dot live"; status.textContent = "listening"; };
  ws.onclose = () => { dot.className = "dot"; status.textContent = "disconnected, retrying…"; setTimeout(connect, 1000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "speaking") { dot.className = "dot speaking"; status.textContent = "someone is speaking…"; return; }
    if (m.type === "partial") { live.textContent = m.text; return; }
    if (m.type === "picture") { showPicture(m); return; }
    if (m.type === "prompt") { showAsk(m); return; }
    if (m.type === "warning") { status.textContent = "⚠️ " + m.text; dot.className = "dot"; return; }
    if (m.type === "voice") { const el = byId[m.id]; if (el) el.querySelector(".en").prepend("🔊 "); return; }
    dot.className = "dot live"; status.textContent = "listening";
    let el = byId[m.id];
    if (!el) {
      el = document.createElement("div");
      el.className = "line";
      el.innerHTML = '<div class="orig"></div><div class="en pending">translating…</div>';
      lines.prepend(el);
      byId[m.id] = el;
      while (lines.children.length > 6) lines.lastChild.remove();
    }
    if (m.type === "original") el.querySelector(".orig").textContent = m.text;
    if (m.type === "english") {
      const en = el.querySelector(".en"); en.classList.remove("pending");
      renderKept(en, m.text, m.kept || []);
      if (m.route === "english") el.querySelector(".orig").textContent = "said in English";
    }
    if (m.type === "details") {
      const en = el.querySelector(".en");
      if (m.intent === "question" || m.intent === "request") { el.classList.add("ask"); en.prepend("❓ "); }
      if (m.cards && m.cards.length) {
        const box = document.createElement("div"); box.className = "cards";
        for (const c of m.cards) {
          const card = document.createElement("div"); card.className = "card";
          card.innerHTML = `${ICONS[c.category] || "🔖"} <b></b> <span></span>`;
          card.querySelector("b").textContent = c.title;
          card.querySelector("span").textContent = c.note ? "— " + c.note : "";
          box.append(card);
        }
        el.append(box);
      }
    }
  };
}
connect();
</script>
</body>
</html>
