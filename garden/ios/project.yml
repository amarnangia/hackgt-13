# Generate the Xcode project with:  cd garden/ios && xcodegen
name: Weave
options:
  bundleIdPrefix: com.weave
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # To install on your iPhone: set your team here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
targets:
  Weave:
    type: application
    platform: iOS
    sources: [Weave, Shared]
    info:
      path: Weave/Info.plist
      properties:
        CFBundleDisplayName: Weave
        UIAppFonts: [InstrumentSerif-Regular.ttf, InstrumentSerif-Italic.ttf, BricolageGrotesque-Variable.ttf, TiroTelugu-Regular.ttf, TiroTelugu-Italic.ttf]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Weave reads your garden from the Mac running the call translator.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [weave]
    entitlements:
      path: Weave/Weave.entitlements
      properties:
        com.apple.security.application-groups: [group.com.weave.garden]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weave.garden
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: WeaveWidget
  WeaveWidget:
    type: app-extension
    platform: iOS
    sources:
      - WeaveWidget
      - path: Shared
    info:
      path: WeaveWidget/Info.plist
      properties:
        CFBundleDisplayName: Weave
        UIAppFonts: [InstrumentSerif-Regular.ttf, InstrumentSerif-Italic.ttf, BricolageGrotesque-Variable.ttf, TiroTelugu-Regular.ttf, TiroTelugu-Italic.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: WeaveWidget/WeaveWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.weave.garden]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weave.garden.widget
        TARGETED_DEVICE_FAMILY: "1"
  WeaveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WeaveUITests]
    dependencies:
      - target: Weave
    settings:
      base:
        TEST_TARGET_NAME: Weave
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.weave.garden.uitests
schemes:
  Weave:
    build:
      targets:
        Weave: all
        WeaveWidget: all
    test:
      targets: [WeaveUITests]
    run:
      config: Debug
