<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weave captions</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Sans+Telugu:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --text: #f3f3f1; --text-2: #b4b4ba; --text-3: #7c7c84; --border: rgba(255,255,255,.08); --border-2: rgba(255,255,255,.14);
  --accent: #5b8cff; --accent-rgb: 91,140,255; --surface: rgba(22,23,28,.9);
  --ui: "Geist", -apple-system, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; --serif: "Newsreader", Georgia, serif;
  --telugu: "Noto Sans Telugu", "Geist", sans-serif; --spring: cubic-bezier(.32,.72,0,1);
  /* same colour scheme as the page around it, or the browser paints this frame solid instead of see-through */
  color-scheme: normal;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; color: var(--text); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.eyebrow { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }

.wrap { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 14px; }
.head { display: flex; align-items: center; gap: 8px; height: 20px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; padding-right: 30px; }
.head b { color: var(--text); font-weight: 500; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex: none; transition: background .3s, box-shadow .3s; }
.dot.on { background: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.2); }
.lang { font: 400 11px var(--mono); color: var(--text-3); }
.wire { flex: 1; position: relative; height: 12px; min-width: 40px; margin: 0 4px; }
.wire .ln { position: absolute; left: 7px; right: 7px; top: 50%; height: 1px; background: rgba(var(--accent-rgb),.3); overflow: hidden; }
.wire.translating .ln::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--accent), transparent) 0 0 / 40% 100% no-repeat; animation: shimmer 1.1s linear infinite; }
.wire .n { position: absolute; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--text-2); }
.wire .n.you { left: 0; } .wire .n.them { right: 0; background: var(--accent); }
.pulse { position: absolute; top: 50%; width: 18px; height: 3px; margin-top: -1.5px; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent);
         filter: drop-shadow(0 0 5px rgba(var(--accent-rgb),.8)); animation: travel 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
.pulse.rev { animation-name: travel-rev; }
@keyframes travel { from { left: 4%; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { left: calc(96% - 18px); opacity: 0; } }
@keyframes travel-rev { from { left: calc(96% - 18px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { left: 4%; opacity: 0; } }
@keyframes shimmer { from { background-position: -40% 0; } to { background-position: 140% 0; } }
.mode { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(var(--accent-rgb),.35); border-radius: 999px; padding: 4px 7px; }

.prev { font: 400 clamp(13px, 2.6vw, 17px)/1.35 var(--serif); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.35em;
        padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.ask { display: flex; align-items: baseline; gap: 8px; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; flex: none; padding: 7px 10px; border-radius: 12px; border: 1px solid rgba(var(--accent-rgb),.4);
       background: rgba(var(--accent-rgb),.1); animation: rise .32s var(--spring) both; }
.ask .te { font: 400 16px var(--telugu); } .ask .rom { font: italic 400 14px var(--serif); color: var(--text-2); }
.ask .en { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.prev[hidden], .ask[hidden] { display: none; }
.cur { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
       -webkit-mask-image: linear-gradient(transparent, #000 18px); mask-image: linear-gradient(transparent, #000 18px); }
.who { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.who.you { color: var(--text-2); }
.tag { font: 500 9.5px/1 var(--mono); color: var(--accent); background: rgba(var(--accent-rgb),.12); border-radius: 5px; padding: 3px 5px; }
.orig { font: 400 clamp(14px, 2.9vw, 19px)/1.5 var(--telugu); color: var(--text-2); }
.tr { font: 400 clamp(20px, 4.6vw, 34px)/1.25 var(--serif); letter-spacing: -0.01em; color: var(--text); margin-top: 2px; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
.pending { display: flex; align-items: center; gap: 8px; height: 28px; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.pending::before { content: ""; width: 26px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--accent), transparent) 0 0 / 60% 100% no-repeat; animation: shimmer .9s linear infinite; }
.caret::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -0.15em; background: var(--accent); animation: blink .9s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.w { cursor: pointer; color: var(--accent); border-bottom: 1px dashed rgba(var(--accent-rgb),.6); }
.pic { margin-top: 8px; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 10px;
       border: 1px solid var(--border); background: var(--surface); font-size: 13px; animation: rise .35s var(--spring) both; transition: background .2s; }
.pic:hover { background: rgba(40,42,50,.95); }
.pic img { width: 30px; height: 30px; border-radius: 7px; object-fit: cover; }
.card { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; border-radius: 14px;
        border: 1px solid var(--border-2); background: rgba(17,18,22,.97); box-shadow: 0 12px 40px -12px #000; animation: rise .32s var(--spring) both; }
.card img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; }
.card .t { flex: 1; min-width: 0; }
.card .big { font: 400 20px/1.25 var(--serif); }
.card .en { font-size: 13px; color: var(--text-2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .x { width: 26px; height: 26px; border-radius: 8px; color: var(--text-3); align-self: flex-start; transition: background .2s, color .2s; }
.card .x:hover { background: rgba(255,255,255,.08); color: var(--text); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

/* shrunk to a pill: just the state */
.pill { display: none; height: 100%; align-items: center; gap: 8px; padding: 0 16px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.pill b { color: var(--text); font-weight: 500; }
@media (max-height: 60px) { .wrap { display: none; } .pill { display: flex; } }
</style>
</head>
<body>
<div class="pill"><span class="dot" id="p-dot"></span><b>Weave</b><span id="p-text">Waiting for subtitles.py</span></div>
<div class="wrap">
  <div class="head"><span class="dot" id="dot"></span><b id="name">Grandma</b><span class="lang">Telugu → English</span>
    <div class="wire" id="wire"><i class="n you"></i><span class="ln"></span><i class="n them"></i></div><span class="mode">Live</span></div>
  <div class="prev" id="prev"></div>
  <div class="ask" id="ask" hidden></div>
  <div class="cur" id="cur"></div>
</div>
<div id="card"></div>
<script src="captions.js"></script>
</body>
</html>
